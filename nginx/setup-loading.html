<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening Setup Wizard</title>
    <link rel="stylesheet" href="/assets/setup-loading.css" />
    <script src="/assets/setup-loading.js" defer></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">AWARE Dashboard</p>
      <h1>Opening setup wizard</h1>
      <p>
        This page waits for the setup wizard on port <code>9999</code> and
        redirects as soon as it responds.
      </p>
      <div class="spinner" aria-hidden="true"></div>
      <div class="status" id="status">
        Checking <code id="target-url"></code>...
      </div>
      <div class="actions">
        <a class="button button-primary" id="open-setup" href="#"
          >Open setup wizard</a
        >
        <a class="button button-secondary" href="/">Back to main page</a>
      </div>
    </main>

  </body>
</html>
