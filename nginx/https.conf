# A WebSocket handshake carries `Upgrade: websocket`; anything else carries no
# `Upgrade` header at all. Sending `Connection: upgrade` upstream regardless would
# break an ordinary request that happened to reach a socket route, so the value
# follows what the client actually asked for.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options     "nosniff"                             always;
    add_header X-Frame-Options            "SAMEORIGIN"                          always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
    add_header X-XSS-Protection           "1; mode=block"                       always;

    # Internal subrequest used by auth_request — not reachable externally
    location = /auth/validate {
        internal;
        set $auth_validate_upstream http://dashboard-api:8000;
        proxy_pass $auth_validate_upstream/auth/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
            client_max_body_size 1024m;
    }

    # Login / logout pages — no auth required
    location /auth/ {
        set $auth_upstream http://dashboard-api:8000;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect to login, preserving the originally requested URL
    location @require_login {
        return 302 /auth/login?next=$request_uri;
    }

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Stylesheets and scripts for the pages in this server block. They hold
    # presentation and behaviour rather than study data, and the landing page is
    # itself public, so they are served without the login check. Headers come
    # from the server block above, which is why none are repeated here.
    location /assets/ {
        root /usr/share/nginx/html;
    }

    location = /setup-launch/ {
        auth_request /auth/validate;
        error_page 401 = @require_login;
        root /usr/share/nginx/html;
        try_files /setup-loading.html =404;
    }

    location = /backup/ {
        auth_request /auth/validate;
        error_page 401 = @require_login;
        root /usr/share/nginx/html;
        try_files /backup.html =404;
    }

    # Configurator static assets (JS/CSS bundles)
    location /configurator/static/ {
        auth_request /auth/validate;
        error_page 401 = @require_login;
        alias /usr/share/nginx/html/configurator_static/;
        expires 1y;
        add_header Cache-Control              "public, immutable";
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options     "nosniff"                             always;
        add_header X-Frame-Options            "SAMEORIGIN"                          always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
        add_header X-XSS-Protection           "1; mode=block"                       always;
    }

    # Configurator public root files (manifest.json, favicon.ico, etc.)
    location ~* ^/configurator/([^/]+\.[^/]+)$ {
        auth_request /auth/validate;
        error_page 401 = @require_login;
        alias /usr/share/nginx/html/configurator_static/$1;
    }

    # AWARE Configurator (Django + React)
    location /configurator/ {
        auth_request /auth/validate;
        error_page 401 = @require_login;
        set $configurator_upstream http://configurator:8000;
        rewrite ^/configurator/(.*)$ /$1 break;
        proxy_pass $configurator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AWARE Micro Server cached assets (QR code image, sensor icons)
    location /cache/ {
        set $micro_server_cache_upstream http://micro-server:8080;
        proxy_pass $micro_server_cache_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AWARE Micro Server QR code study join landing page /:studyNumber/:studyKey
    # Android's study number, joined and uploaded to separately because its data
    # lives in another schema and another row shape. A GET here is a phone fetching
    # its configuration, and the Android one is the file nginx already serves --
    # the micro-server would answer with its own shape, which the client cannot
    # read. Uploads go to the Android instance below.
    location ~ ^/2/(\w+)$ {
        default_type application/json;
        alias /usr/share/nginx/html/studies/studyConfig.json;
    }

    location ~ ^/2/([^/]+)/([^/]+)/([^/]+)$ {
        set $micro_android_upstream http://micro-server-android:8082;
        rewrite ^/2/([^/]+)/([^/]+)/([^/]+)$ /index.php/2/$1/$2/$3 break;
        proxy_pass $micro_android_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/\d+/\w+$ {
        set $micro_server_upstream http://micro-server:8080;
        proxy_pass $micro_server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AWARE Micro Server upload and study config endpoint used by AWARE mobile clients
    location /index.php/ {
        set $micro_server_php_upstream http://micro-server:8080;
        proxy_pass $micro_server_php_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AWARE Micro Server table upload/query endpoint without the /index.php/ prefix
    # (rewritten internally to the micro-server's real /index.php/ route)
    location ~ ^/(\d+)/([^/]+)/([^/]+)/([^/]+)$ {
        set $micro_server_table_upstream http://micro-server:8080;
        rewrite ^/(\d+)/([^/]+)/([^/]+)/([^/]+)$ /index.php/$1/$2/$3/$4 break;
        proxy_pass $micro_server_table_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /studies/files/ {
        alias /usr/share/nginx/html/studies/;
        # Off whichever dataflow the study runs. This path is public and
        # unauthenticated because a joining phone fetches its study config from
        # it, so a listing hands anyone the name of every file in the directory --
        # including ones left behind by an earlier deployment. A phone is given
        # the exact URL it needs; nothing legitimate browses this.
        autoindex off;
    }

    # Studies landing page and direct study file access
    location /studies/ {
        root /usr/share/nginx/html;
        index index.html;
    }

    # The live channel, which is a WebSocket and so needs three things an ordinary
    # proxied request does not. HTTP/1.1, because the upgrade handshake does not
    # exist in 1.0 and nginx proxies with 1.0 by default. The handshake headers
    # passed through rather than dropped. And a read timeout longer than the quiet
    # stretches: nginx counts a socket waiting for the next change as idle, so the
    # default minute would close a connection on any study that goes quiet.
    #
    # No `error_page 401` here. Every other location sends an unauthenticated
    # visitor to the login page, which a socket cannot render -- the client is told
    # the handshake was refused and lets the page handle it.
    location = /api/live {
        auth_request /auth/validate;
        set $dashboard_api_live_upstream http://dashboard-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $dashboard_api_live_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A change must reach the browser when it happens, not when a buffer fills.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Analytics API
    location /api/ {
        auth_request /auth/validate;
        error_page 401 = @require_login;
        set $dashboard_api_upstream http://dashboard-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $dashboard_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8192m;
        proxy_request_buffering off;
        # The database export is compressed as it is dumped and can run for
        # hours, so it reaches the browser chunk by chunk instead of being
        # collected here first.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dashboard frontend (React SPA)
    location /dashboard/ {
        auth_request /auth/validate;
        error_page 401 = @require_login;
        set $dashboard_upstream http://dashboard:80;
        proxy_pass $dashboard_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # iOS ESM config file
    location /esm/ {
        alias /usr/share/nginx/html/esm/;
        add_header Access-Control-Allow-Origin *;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options     "nosniff"                             always;
    }
}
