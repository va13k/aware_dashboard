# Every check this project has, run where nobody has to remember to run it.
#
# The suites are split by the runtime each one needs rather than by component, so a
# red job names the language its failure is in. Versions are the ones the Dockerfiles
# build with: a suite passing here against a different Python or Node says nothing
# about the deployment.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  # Run it from the Actions tab, on any branch, without a commit to trigger it. The
  # deployment job is the one this is worth having for: it depends on what a runner
  # provides, so re-running it unchanged is sometimes the thing to do.
  workflow_dispatch:

# Nothing here writes to the repository, so the token is given no more than it reads
# with.
permissions:
  contents: read

# A second push to the same branch replaces the run still going, rather than queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Study model and read layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 3.12 is what analytics_api's image runs, and what its requirements were
      # compiled against.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics_api/requirements-dev.txt

      - name: Install
        run: pip install -r analytics_api/requirements-dev.txt

      # The study model, the setup scripts, the entrypoint parity and the generated
      # schema, which this suite asks about rather than leaving to memory.
      - name: shared_config
        run: python -m pytest shared_config -q

      - name: analytics_api
        working-directory: analytics_api
        run: python -m pytest -q

  configurator-backend:
    name: Configurator backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Its own image runs 3.11, and its own pins: this component and the read layer
      # ask for different versions of cryptography and PyMySQL, which is a conflict
      # only in an environment holding both. A deployment gives each its own.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AWARE-Configurator/requirements.txt

      # pytest is not among the Configurator's own requirements, and is asked for
      # here rather than pinned a second time in the repository.
      - name: Install
        run: pip install -r AWARE-Configurator/requirements.txt pytest

      - name: AWARE-Configurator
        run: python -m pytest AWARE-Configurator -q

  windows-host-scripts:
    name: Host scripts on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The deploy runs Linux containers, so a deployment cannot be brought up here.
      # What can be, and what a Windows researcher meets first, is the host half:
      # every script after `compose up` reads the study model, and one Unix-only
      # import in that path stops all of them before they do anything.
      - name: Every host script imports, and the study model reads
        run: |
          python -c "import setup.deploy_config"
          python -c "import setup.init_study_tables"
          python -c "import setup.publish_authority"
          python -c "import setup.verify_database"
          python -c "import setup.verify_ingest"
          python -c "import setup.check_ports"
          python -c "import setup.send_message"
          python -c "from shared_config.source_store import read_source; read_source()"

      # The researcher's login, hashed. This used to be `openssl passwd`, a program
      # Windows does not carry.
      - name: The researcher's password hashes
        run: >-
          python -c "import sys; sys.path.insert(0, 'setup'); import deploy_config;
          print(deploy_config.apr1_hash('probe', 'abcdefgh'))"

      # Asked of the functions rather than the command, because the verdict depends
      # on what the runner happens to hold: what is being checked here is that the
      # socket and platform halves answer at all on Windows.
      - name: The port check answers on this platform
        run: >-
          python -c "import sys; sys.path.insert(0, 'setup'); import check_ports;
          print(check_ports.own_addresses());
          print([a['port'] for a in check_ports.wanted(check_ports.read_env())]);
          print(check_ports.find_command(80))"

  integration:
    name: Read layer against a real MySQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics_api/requirements-dev.txt

      - name: Install
        run: pip install -r analytics_api/requirements-dev.txt

      # The suite starts a server of its own and skips when there is none, so the
      # binary is asked for here: a missing one is a red job rather than a green one
      # that tested nothing.
      - name: MySQL server
        run: |
          mysqld --version
          # The server is started on a data directory under the temporary folder,
          # which Ubuntu's AppArmor profile for mysqld denies it. Unloading that
          # profile lets it read and write the directory it was given.
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          fi

      - name: analytics_api, integration
        working-directory: analytics_api
        run: python -m pytest -m integration -q

  dashboard:
    name: Dashboard types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci

      - name: Types
        working-directory: dashboard
        run: npx tsc -b

      - name: Lint
        working-directory: dashboard
        run: npx eslint .

  configurator-frontend:
    name: Configurator frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: AWARE-Configurator/reactapp/package-lock.json

      - name: Install
        working-directory: AWARE-Configurator/reactapp
        run: npm ci

      - name: Tests
        working-directory: AWARE-Configurator/reactapp
        env:
          CI: "true"
        run: npx react-scripts test --watchAll=false

  micro-server:
    name: Micro-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: temurin
          cache: gradle

      - name: Check
        working-directory: aware-micro-server
        run: ./gradlew check --no-daemon

  deploy:
    name: A fresh clone deploys and ingests (${{ matrix.dataflow }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # The two dataflows are different deployments, and one failing should not hide
      # what the other did.
      fail-fast: false
      matrix:
        dataflow: [webservice, direct]
    steps:
      - uses: actions/checkout@v5

      # The runner ships MySQL, stopped. On the direct dataflow this deployment
      # publishes 3306 on every interface, so a server left running would be a port
      # conflict rather than a fault.
      - name: Free the ports this deployment publishes
        run: sudo systemctl stop mysql || true

      - name: Declare the study
        env:
          ANDROID_DATAFLOW: ${{ matrix.dataflow }}
        run: |
          {
            echo "PUBLIC_HOST=localhost"
            echo "PUBLIC_PORT=80"
            echo "PROTOCOL=http"
            echo "HOST_UID=$(id -u)"
            echo "HOST_GID=$(id -g)"
          } > .env
          python3 - <<'PY'
          import json
          import os
          import pathlib

          # The dataflow is declared in the study model rather than in .env: run
          # outside the wizard, the deploy reads the model's own answer and leaves it
          # standing.
          source = json.loads(pathlib.Path("source.example.json").read_text(encoding="utf-8"))
          source["deployment"]["dataflow"]["android"] = os.environ["ANDROID_DATAFLOW"]
          pathlib.Path("source.json").write_text(
              json.dumps(source, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Generate every configuration file
        run: |
          mkdir -p studies aware-micro-server/cache aware-micro-server/esm
          python3 setup/deploy_config.py

      - name: The ports it needs are free
        run: python3 setup/check_ports.py

      - name: Bring the stack up
        run: docker compose up --build -d --wait --wait-timeout 600

      - name: Create the schema and the accounts
        run: python3 setup/init_study_tables.py

      - name: Publish the authority the database generated
        run: python3 setup/publish_authority.py

      - name: The database answers what this study asks
        run: python3 setup/verify_database.py

      # The question a participant's phone asks, from outside the compose network.
      - name: A phone's data would arrive
        run: python3 setup/verify_ingest.py

      - name: What the containers said
        if: failure()
        run: |
          docker compose ps
          # Per service, because a single tail across eleven of them leaves too
          # little of the one that failed.
          for service in mysql micro-server micro-server-android nginx dashboard-api configurator mqtt; do
            echo "::group::$service"
            docker compose logs --tail=120 "$service" || true
            echo "::endgroup::"
          done
