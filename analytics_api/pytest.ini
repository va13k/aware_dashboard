[pytest]
# Integration tests start a real MySQL and take seconds rather than
# milliseconds, so they are left out unless asked for:
#
#   pytest                    - the fast suite (default)
#   pytest -m integration     - only the ones that need a database
#   pytest -m ""              - everything
addopts = -m "not integration"
markers =
    integration: needs a local MySQL server; see analytics_api/README.md
    no_session: leaves the application's session guard in place, rather than
        answering as a logged-in researcher the way every other test does
