services:
  setup-wizard:
    build: ./setup
    container_name: aware_setup
    profiles: ["setup"]
    ports:
      - "9999:9999"
    volumes:
      - .:/project
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # The one path that speaks to a phone. The AWARE clients subscribe on connect and
  # act on what arrives, so what the deployment was missing is this end of it.
  # Participants reach it on the port the protocol decides -- 8883 with the
  # deployment's own certificate, 1883 in clear -- and the API publishes over the
  # compose network on 1883 whichever it is.
  mqtt:
    image: eclipse-mosquitto:2
    container_name: aware_mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-0.0.0.0}:${MQTT_PUBLIC_PORT:-1883}:${MQTT_PUBLIC_PORT:-1883}"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwords:/mosquitto/config/passwords:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mqtt_data:/mosquitto/data
      - ${SSL_CERTIFICATE_PATH:-/dev/null}:/mosquitto/certs/fullchain.pem:ro
      - ${SSL_CERTIFICATE_KEY_PATH:-/dev/null}:/mosquitto/certs/privkey.pem:ro
    healthcheck:
      # Asked as a client rather than by looking at the process: a broker that is
      # running and refusing every connection is what this has to catch.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u $$MQTT_PUBLISHER_USER -P $$MQTT_PUBLISHER_PASSWORD -t healthcheck -C 1 -W 3 -E || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    environment:
      MQTT_PUBLISHER_USER: ${MQTT_PUBLISHER_USER:-aware_publisher}
      MQTT_PUBLISHER_PASSWORD: ${MQTT_PUBLISHER_PASSWORD:-}
    networks:
      - aware_network

  mysql:
    image: mysql:8.0
    container_name: aware_mysql
    restart: unless-stopped
    command:
      - --init-file=/etc/mysql/init_all.sql
      - --connect-timeout=5
      - --max-user-connections=${MYSQL_MAX_USER_CONNECTIONS_PER_ACCOUNT:-100}
      - --performance-schema=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      PARTICIPANT_DB_PASSWORD: ${PARTICIPANT_DB_PASSWORD:-}
      # Read by the healthcheck, which connects as the account the dashboard uses.
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analyticspass}
      ANDROID_SERVER_DB_PASSWORD: ${ANDROID_SERVER_DB_PASSWORD:-}
    ports:
      # Published only so participant phones can reach MySQL themselves, which is
      # what the direct dataflow requires. On the webservice dataflow nothing
      # outside this machine has any business here, so setup binds it to loopback
      # instead: every service in this file reaches MySQL as `mysql:3306` over the
      # compose network, so narrowing the published address costs them nothing.
      # No default on purpose. The right address depends on who opens the database
      # and where it runs, and neither answer is safe to guess: 0.0.0.0 would publish
      # a webservice study's database to the internet, and 127.0.0.1 would cut every
      # participant off a direct one. deploy_config.py derives it from the study, so
      # its absence means the study was never applied -- which is a deployment to
      # stop rather than one to guess at.
      # Long syntax so the address can carry an error message: in the short form the
      # colons in one would be read as port separators.
      - target: 3306
        published: 3306
        protocol: tcp
        host_ip: ${MYSQL_BIND_ADDRESS:?derived from the study by setup/deploy_config.py - run it before bringing the stack up}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
      - ./db/init_all.sql:/etc/mysql/init_all.sql:ro
    networks:
      - aware_network
    healthcheck:
      # Over TCP with TLS, which is how every service actually reaches this database:
      # each account requires an encrypted connection, and a unix socket carries no
      # TLS, so a socket check would be refused however healthy the server is. Asking
      # the same way the readers ask is also what makes this answer their question.
      test:
        [
          "CMD-SHELL",
          "mysql --protocol=TCP -h127.0.0.1 --ssl-mode=REQUIRED -u aware_analytics -p\"$$ANALYTICS_DB_PASSWORD\" aware_android -e 'SELECT 1' 2>/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s

  mysql-backup:
    image: mysql:8.0
    container_name: aware_mysql_backup
    restart: unless-stopped
    environment:
      # The same declaration, resolved for a service inside the deployment.
      MYSQL_HOST: ${DB_SERVICE_HOST:-mysql}
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      BACKUP_DATABASES: "aware_android aware_ios"
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${MYSQL_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${MYSQL_BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${MYSQL_BACKUP_HOST_DIR:-./backups/mysql}:/backups
      - ./setup/mysql-backup/backup.sh:/usr/local/bin/aware-db-backup:ro
    networks:
      - aware_network
    depends_on:
      mysql:
        condition: service_healthy
    command: ["/bin/sh", "/usr/local/bin/aware-db-backup"]

  micro-server:
    build: ./aware-micro-server
    container_name: aware_micro
    restart: unless-stopped
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k"
    develop:
      watch:
        - path: ./aware-micro-server/aware-config.json
          action: restart
    volumes:
      - ./aware-micro-server/aware-config.json:/app/aware-config.json:ro
    expose:
      - "8080"
    networks:
      - aware_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The Android instance. One micro-server holds one study and one database, and
  # the platforms share neither: their schemas keep a row in different shapes, so a
  # single instance cannot write both. Same image, its own configuration.
  micro-server-android:
    build: ./aware-micro-server
    container_name: aware_micro_android
    restart: unless-stopped
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k"
    develop:
      watch:
        - path: ./aware-micro-server/aware-config.android.json
          action: restart
    volumes:
      - ./aware-micro-server/aware-config.android.json:/app/aware-config.json:ro
    # The port its own configuration gives it, and the one nginx proxies the
    # Android insert path to.
    expose:
      - "8082"
    networks:
      - aware_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8082/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  configurator:
    build:
      context: ./AWARE-Configurator
      args:
        SERVER_PROTOCOL: ${PROTOCOL:-http}
        SERVER_IP: ${PUBLIC_HOST:-localhost}
        SERVER_PORT: "${PUBLIC_PORT:-80}"
        SERVER_BASE_PATH: /configurator
    container_name: aware_configurator
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_PORT: ${PUBLIC_PORT:-80}
      PROTOCOL: ${PROTOCOL:-http}
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - .:/project
      - configurator_static:/app/staticfiles
      - ./studies:/app/saved_json_files
    networks:
      - aware_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/")''',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: aware_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx/backup.html:/usr/share/nginx/html/backup.html:ro
      - ./nginx/assets:/usr/share/nginx/html/assets:ro
      - ./nginx/configurator-loading.html:/usr/share/nginx/html/configurator-loading.html:ro
      - ./nginx/setup-loading.html:/usr/share/nginx/html/setup-loading.html:ro
      - ./nginx/${PROTOCOL:-http}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./studies:/usr/share/nginx/html/studies:ro
      - ./aware-micro-server/esm:/usr/share/nginx/html/esm:ro
      - configurator_static:/usr/share/nginx/html/configurator_static:ro
      - ${SSL_CERTIFICATE_PATH:-/dev/null}:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_CERTIFICATE_KEY_PATH:-/dev/null}:/etc/nginx/certs/privkey.pem:ro
    networks:
      - aware_network
    depends_on:
      configurator:
        condition: service_healthy
      micro-server:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      dashboard-api:
        condition: service_healthy

  dashboard-api:
    build: ./analytics_api
    container_name: aware_dashboard_api
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # Derived from the study model's single database declaration by setup, so
      # this service and the refresher below cannot drift apart from each other or
      # from what the phones were told. The default preserves the bundled database
      # for a deployment that has not run setup since this became a variable.
      ANDROID_DATABASE_URL: ${ANDROID_DATABASE_URL:-mysql+aiomysql://aware_analytics:analyticspass@mysql:3306/aware_android}
      IOS_DATABASE_URL: ${IOS_DATABASE_URL:-mysql+aiomysql://aware_analytics:analyticspass@mysql:3306/aware_ios}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      RESEARCHER_USERNAME: ${RESEARCHER_USERNAME:-}
      RESEARCHER_PASSWORD: ${RESEARCHER_PASSWORD:-}
      # Signs the researcher's session cookie. Written once at deployment, so a
      # restart keeps everyone logged in and more than one worker can serve.
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
      # The broker, reached over the compose network on its plaintext listener:
      # the port participants use is a different question, settled by the study's
      # protocol, and does not concern a publisher already inside the deployment.
      MQTT_HOST: aware_mqtt
      MQTT_PORT: "1883"
      MQTT_PUBLISHER_USER: ${MQTT_PUBLISHER_USER:-aware_publisher}
      MQTT_PUBLISHER_PASSWORD: ${MQTT_PUBLISHER_PASSWORD:-}
      # The deployed study config, used to tell a phone's installed config apart
      # from the current one. Read-only: the API never writes study configs, and
      # it must never return the file itself - it holds participant credentials.
      CURRENT_STUDY_CONFIG_PATH: /app/studies/studyConfig.json
      # studyConfig.json holds the Android settings; the settings iPhones
      # receive come from the micro-server config.
      MICRO_SERVER_CONFIG_PATH: /app/aware-config.json
      # The same directory the scheduled dump writes to, so the backup page can
      # offer those archives as import sources. A study-scale restore is far too
      # large to travel through the browser, so it is read from here instead.
      BACKUP_DIR: /backups
    expose:
      - "8000"
    volumes:
      - ./studies:/app/studies:ro
      - ./aware-micro-server/aware-config.json:/app/aware-config.json:ro
      - ${MYSQL_BACKUP_HOST_DIR:-./backups/mysql}:/backups:ro
      # The study's own vocabulary -- topics, channels, the rate limit -- read from
      # the one module that defines it rather than restated here, so the API and the
      # deploy cannot disagree about where a message goes.
      - ./shared_config:/app/shared_config:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aware_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/health")''',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  counts-refresher:
    build: ./analytics_api
    container_name: aware_counts_refresher
    restart: unless-stopped
    mem_limit: 256m
    command: ["python", "-m", "app.refresh_counts"]
    environment:
      ANDROID_DATABASE_URL: ${ANDROID_DATABASE_URL:-mysql+aiomysql://aware_analytics:analyticspass@mysql:3306/aware_android}
      IOS_DATABASE_URL: ${IOS_DATABASE_URL:-mysql+aiomysql://aware_analytics:analyticspass@mysql:3306/aware_ios}
      # How often a pass runs, and the file each completed pass stamps. The
      # healthcheck below reads both.
      COUNTS_REFRESH_INTERVAL_SECONDS: ${COUNTS_REFRESH_INTERVAL_SECONDS:-60}
      COUNTS_REFRESH_HEARTBEAT: /tmp/counts-refresh-heartbeat
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aware_network
    healthcheck:
      # A crashed loop is restarted by the policy above; this catches the loop
      # that is still alive but no longer completing a pass.
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime("/tmp/counts-refresh-heartbeat") < 5 * int(os.environ.get("COUNTS_REFRESH_INTERVAL_SECONDS", "60")) else 1)''',
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  dashboard:
    build: ./dashboard
    container_name: aware_dashboard
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - aware_network
    depends_on:
      - dashboard-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1/dashboard/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  aware_network:
    driver: bridge

volumes:
  mysql_data:
  mqtt_data:
  configurator_static:
